# Site Settings
title: The Philosopher's Stones
subtitle: "Customer Success Leader & Builder"
name: Carl-Erik
description: >-
  Personal blog documenting projects, technical explorations,
  and customer success insights.
url: "https://carlerik.com"
baseurl: ""

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"

# Site Author
author:
  name: "Carl-Erik"
  bio: "Customer Success professional with a technical edge. Bridging customers and code."
  location: ""
  avatar: "/assets/images/avatar.jpg"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/carlerik88"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "#"

# Reading Files
include:
  - _pages

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /writing/page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
